<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - First Steps</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="navbar">
  <h1 class="logo">First Steps</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="volunteer.html">Volunteer</a>
  </nav>
</header>

<section class="page-section">
  <div class="page-box">
    <h2>Request a Meeting</h2>

    <form
      class="contact-form"
      action="https://formspree.io/f/mojbqwqd"
      method="POST"
    >

      <label>Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone">

       <label>Meeting Details</label>
      <textarea
        name="meeting"
        rows="5"
        placeholder="Preferred days and times"
      ></textarea>

      <button type="submit" class="hero-button">
        Request Meeting
      </button>

    </form>

  </div>
</section>

</body>
</html>
